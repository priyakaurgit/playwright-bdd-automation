name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # allows manual trigger
  schedule:          # daily at 5 AM
    - cron: '0 5 * * *'

jobs:
   build_and_test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.HOST }}
      USER_EMAIL: ${{ secrets.USERNAME }}
      USER_PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run tests (Playwright-BDD)
      - name: Run Playwright BDD tests
        run: npx bddgen && npx playwright test --reporter=html

      # 6. Upload Playwright report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # 7. Upload test results (screenshots/videos)
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results
          retention-days: 7

   deploy_html_report:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download HTML report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report

      - name: Send email with HTML report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Playwright BDD Test Report
          body: |
            Hi Team,

            The latest Playwright BDD test run has completed.  
            Please find the HTML report here: https://github.com/priyakaurgit/playwright-bdd-automation/blob/gh-pages/index.html

            Best Regards,
            Priya Kaur
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          secure: true
